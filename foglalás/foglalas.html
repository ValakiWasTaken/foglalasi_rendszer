<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foglalás - Vágó úr Fodrászata</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="foglalas.css">
    <script src="foglalas.js" defer></script>
</head>

<body>
    <nav class="navbar navbar-expand-sm bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/index.html">Vágó Úr Fodrászata</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarSupportedContent">
                <ul class="navbar-nav nav_gap">
                    <li class="nav-item">
                        <a class="nav-link nav_admin"
                            title="Foglalások megtekintése (adminisztrátori hozzáférés szükséges)"
                            href="/bejelentkezés/bejelentkezes.html">Foglalások</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="card" style="width: 40rem;">
        <form>
            <div class="form-floating">
                <select id="szolgaltatas" name="szolgaltatas" required class="form-select">
                    <option selected disabled value="">Kérem válasszon...</option>
                    <option value="3500">Gépi hajvágás</option>
                    <option value="4000">Ollós hajvágás</option>
                    <option value="3000">Szakálligazítás</option>
                    <option value="2500">Gyermek hajvágás (12 éves korig)</option>
                </select>
                <label for="szolgaltatas">Szolgáltatás:</label>
            </div>
            <div class="form_flex">
                <div class="form-check">
                    <p class="form_caption">Hajhossz:</p>
                    <input type="radio" name="hajhossz" id="rovid" value="1" required>
                    <label for="rovid">Rövid (< 8 cm)</label>
                            <br>
                            <input type="radio" name="hajhossz" id="kozepes" value="1.2">
                            <label for="kozepes">Közepes (< 25 cm)</label>
                                    <br>
                                    <input type="radio" name="hajhossz" id="hosszu" value="1.5">
                                    <label for="hosszu">Hosszú (> 25 cm)</label>
                </div>
                <div class="form-check">
                    <p class="form_caption">Extra:</p>
                    <input type="checkbox" name="mosas" id="mosas" value="1000">
                    <label for="mosas">Mosás, szárítás</label>
                    <br>
                    <input type="checkbox" name="festes" id="festes" value="10000">
                    <label for="festes">Hajfestés</label>
                    <br>
                    <input type="checkbox" name="gondorites" id="gondorites" value="1000">
                    <label for="gondorites">Hajgöndörítés</label>
                </div>
            </div>
            <hr>
            <div>
                <p class="form_caption form_time">Dátum:</p>
                <input type="date" name="datum" id="datum" required class="btn btn-light">
            </div>
            <div class="form-check form_time">
                <p class="form_caption time_caption">Időpont:</p>
                <input type="radio" name="ido" id="kilenc_ora" value="9" class="btn-check" required>
                <label for="kilenc_ora" class="btn btn-light">9:00</label>
                <input type="radio" name="ido" id="tiz_ora" value="10" class="btn-check">
                <label for="tiz_ora" class="btn btn-light">10:00</label>
                <input type="radio" name="ido" id="tizenegy_ora" value="11" class="btn-check">
                <label for="tizenegy_ora" class="btn btn-light">11:00</label>
                <input type="radio" name="ido" id="tizenharom_ora" value="13" class="btn-check">
                <label for="tizenharom_ora" class="btn btn-light break">13:00</label>
                <input type="radio" name="ido" id="tizennegy_ora" value="14" class="btn-check">
                <label for="tizennegy_ora" class="btn btn-light">14:00</label>
                <input type="radio" name="ido" id="tizenot_ora" value="15" class="btn-check">
                <label for="tizenot_ora" class="btn btn-light">15:00</label>
                <input type="radio" name="ido" id="tizenhat_ora" value="16" class="btn-check">
                <label for="tizenhat_ora" class="btn btn-light">16:00</label>
                <input type="radio" name="ido" id="tizenhet_ora" value="17" class="btn-check">
                <label for="tizenhet_ora" class="btn btn-light">17:00</label>
            </div>
            <hr>
            <div>
                <label for="nev" class="form_label">Név:</label>
                <input type="text" name="nev" id="nev" required autocomplete="off" class="form-control">
                <label for="email" class="form_caption">Email:</label>
                <input type="text" name="email" id="email" required autocomplete="off" class="form-control">
                <label for="telefon" class="form_caption">Telefonszám:</label>
                <input type="text" name="telefon" id="telefon" required autocomplete="off" class="form-control">
            </div>
            <hr>
            <div class="result_flex">
                <p>Összeg: <span id="osszeg"></span></p>
                <button id="foglalas" class="btn btn-light">Foglalás</button>
            </div>
        </form>
    </div>
    <footer>
        <p>© Vágó Fodrászat Bt. (2026), minden jog fenntartva</p>
        <p>Oldalt készítette: Prell Ádám, Horváth Benedek</p>
    </footer>
</body>

</html>
