<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foglalás - Vágó úr Fodrászata</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="foglalas.css">
    <script src="foglalas.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-sm bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/index.html">Vágó Úr Fodrászata</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarSupportedContent">
                <ul class="navbar-nav nav_gap">
                    <li class="nav-item">
                        <a class="nav-link nav_admin"
                            title="Foglalások megtekintése (adminisztrátori hozzáférés szükséges)"
                            href="/bejelentkezés/bejelentkezes.html">Foglalások</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <form id="foglalas">
        <div>
            <label for="szolgaltatas">Szolgáltatás:</label>
            <select id="szolgaltatas" name="szolgaltatas" required>
                <option selected disabled value="">Kérem válasszon...</option>
                <option value="gepi">Gépi hajvágás</option>
                <option value="ollo">Ollós hajvágás</option>
                <option value="szakall">Szakálligazítás</option>
                <option value="gyerek">Gyermek hajvágás (12 éves korig)</option>
            </select>
        </div>
        <div>
            <p>Hajhossz:</p>
            <input type="radio" name="hajhossz" id="rovid" required>
            <label for="rovid">Rövid (< 8 cm)</label>
            <br>
            <input type="radio" name="hajhossz" id="kozepes">
            <label for="kozepes">Közepes (< 25 cm)</label>
            <br>
            <input type="radio" name="hajhossz" id="hosszu">
            <label for="hosszu">Hosszú (> 25 cm)</label>
        </div>
        <div>
            <p>Extra:</p>
            <input type="checkbox" name="mosas" id="mosas">
            <label for="mosas">Mosás, szárítás</label>
            <br>
            <input type="checkbox" name="festes" id="festes">
            <label for="festes">Hajfestés</label>
        </div>
        <div>
            <p>Időpont:</p>
            <input type="date" name="datum" id="datum" required>
            <br>
            <input type="radio" name="ido" id="kilenc_ora" class="btn-check" required>
            <label for="kilenc_ora" class="btn btn-primary">9:00</label>
            <input type="radio" name="ido" id="tiz_ora" class="btn-check">
            <label for="tiz_ora" class="btn btn-primary">10:00</label>
            <input type="radio" name="ido" id="tizenegy_ora" class="btn-check">
            <label for="tizenegy_ora" class="btn btn-primary">11:00</label>
            <input type="radio" name="ido" id="tizenharom_ora" class="btn-check">
            <label for="tizenharom_ora" class="btn btn-primary">13:00</label>
            <input type="radio" name="ido" id="tizennegy_ora" class="btn-check">
            <label for="tizennegy_ora" class="btn btn-primary">14:00</label>
            <input type="radio" name="ido" id="tizenot_ora" class="btn-check">
            <label for="tizenot_ora" class="btn btn-primary">15:00</label>
            <input type="radio" name="ido" id="tizenhat_ora" class="btn-check">
            <label for="tizenhat_ora" class="btn btn-primary">16:00</label>
            <input type="radio" name="ido" id="tizenhet_ora" class="btn-check">
            <label for="tizenhet_ora" class="btn btn-primary">17:00</label>
        </div>
        <div>
            <label for="nev">Név:</label>
            <input type="text" name="nev" id="nev" required autocomplete="off">
            <label for="email">Email:</label>
            <input type="text" name="email" id="email" required autocomplete="off">
            <label for="telefon">Telefonszám:</label>
            <input type="text" name="telefon" id="telefon" required autocomplete="off">
        </div>
        <p>Összeg: <span class="osszeg"></span></p>
        <button id="foglalas" class="btn btn-primary">Foglalás</button>
    </form>

    <footer>
        <p>© Vágó Fodrászat Bt. (2026), minden jog fenntartva</p>
        <p>Oldalt készítette: Prell Ádám, Horváth Benedek</p>
    </footer>
</body>
</html>
